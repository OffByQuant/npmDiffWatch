# npm-specific code-level JS/TS detection rules
- id: js-eval
  description: eval() or Function() with dynamic string — arbitrary code execution.
  applies_to: code
  weight: 15
  location_scaled: true
  attack_type: dynamic-eval
  match:
    any:
      - bound_call: {category: exec}

- id: js-child-process
  description: child_process.exec/spawn/fork — command execution.
  applies_to: code
  weight: 20
  location_scaled: true
  attack_type: child-process
  match:
    any:
      - bound_call: {category: process}

- id: js-install-script
  description: Dangerous primitive inside a lifecycle script (preinstall/install/postinstall).
  applies_to: code
  weight: 40
  attack_type: install-hook-rce
  match:
    all:
      - location_at_least: 3.0
      - any:
          - bound_call: {category: exec}
          - bound_call: {category: process}
          - bound_call: {category: network}

- id: js-decode-exec
  description: decode + exec/eval co-occur (obfuscated loader — decode then run).
  applies_to: code
  weight: 45
  attack_type: obfuscated-loader
  match:
    all:
      - bound_call: {category: decode}
      - bound_call: {category: exec}

- id: js-cred-network
  description: credential access + network egress co-occur (credential exfiltration).
  applies_to: code
  weight: 45
  attack_type: credential-exfil
  match:
    all:
      - bound_call: {category: credential}
      - bound_call: {category: network}

- id: js-proto-pollution
  description: __proto__ assignment or Object.defineProperty with __proto__ — prototype pollution.
  applies_to: code
  weight: 25
  location_scaled: true
  attack_type: proto-pollution
  match:
    any:
      - bound_call: {category: proto}

- id: js-dynamic-require
  description: require() with non-literal argument — dynamic module load.
  applies_to: code
  weight: 15
  location_scaled: true
  attack_type: dynamic-require
  match:
    any:
      - bound_call: {category: dynamic_require}

- id: js-obfuscated-string
  description: Long encoded string / high-entropy blob on added lines.
  applies_to: code
  weight: 10
  location_scaled: true
  attack_type: obfuscated-data
  match:
    any:
      - blob_present: true
