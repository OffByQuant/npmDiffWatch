# Signals carried from the fetcher about non-source / oversized / opaque members
- id: binary-source-too-large
  description: A source file exceeded the per-file size cap (evasion via bulk).
  applies_to: binary
  weight: 20
  attack_type: size-evasion
  match: {binary_reason: source-too-large}

- id: foreign-language-source
  description: Source in another programming language inside an npm package.
  applies_to: binary
  weight: 25
  attack_type: foreign-code
  match: {binary_reason: foreign-language-source}

- id: binary-new-binary
  description: A newly-added .node or .wasm binary member.
  applies_to: binary
  weight: 10
  attack_type: opaque-binary
  match: {binary_reason: new-binary}
